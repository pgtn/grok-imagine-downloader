name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          # Exercise the minimum Python version without requiring a Grok account.
          - os: ubuntu-22.04
            python: "3.8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check CLI entry point
        run: python -B -X utf8 main.py --help
      - name: Run offline regression tests
        run: python -B -X utf8 -m unittest discover -s tests -v
